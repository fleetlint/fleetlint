# One file for GitHub and Gitea.
# Gitea Actions reads .github/workflows/ too, and both forges set github.server_url.
# Actions are pinned to commit SHAs with `pinact run`
# (Renovate keeps the pins current via renovate.json).
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Unprivileged: the tag is on main and the full check passes. Tools from
  # PyPI and `make tools` run here, never next to the signing identity and
  # the deploy keys.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Shared tools (gitleaks, diff-cover), pinned and checksum-verified
        env:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          GITLEAKS_VERSION: v8.30.1
          # renovate: datasource=pypi depName=diff-cover
          DIFF_COVER_VERSION: 10.6.0
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          v=${GITLEAKS_VERSION#v}
          base="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}"
          curl -sSfLO "${base}/gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL "${base}/gitleaks_${v}_checksums.txt" | grep " gitleaks_${v}_linux_x64.tar.gz$" | sha256sum -c -
          tar -xzf "gitleaks_${v}_linux_x64.tar.gz" -C "$HOME/.local/bin" gitleaks
          rm "gitleaks_${v}_linux_x64.tar.gz"
          pipx install "diff-cover==${DIFF_COVER_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify tag is on main and check passes
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag not on main"; exit 1; }
          make tools
          make check

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release            # GitHub: v* tags only, required reviewer; ignored on Gitea
    permissions:
      contents: write               # create the release and upload assets
      id-token: write               # GitHub only: keyless cosign + attestations (ignored on Gitea)
      attestations: write           # GitHub only
      packages: write               # container image on ghcr.io
    env:
      IS_GITHUB: ${{ github.server_url == 'https://github.com' }}
      # Used by goreleaser's gitea_urls when running on Gitea; empty on GitHub.
      GITEA_API_URL: ${{ github.server_url != 'https://github.com' && format('{0}/api/v1', github.server_url) || '' }}
      GITEA_DOWNLOAD_URL: ${{ github.server_url != 'https://github.com' && github.server_url || '' }}
      # renovate: datasource=github-releases depName=goreleaser/goreleaser
      GORELEASER_VERSION: v2.19.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false                # no cache written by other runs in the job that signs

      # GitHub only: the multi-arch image for ghcr.io and nix-hash for the Nix package.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: env.IS_GITHUB == 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: env.IS_GITHUB == 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.IS_GITHUB == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        if: env.IS_GITHUB == 'true'

      # GoReleaser builds, checksums, generates SBOMs (syft), signs (cosign) and publishes
      # to whichever forge it is running on. See .goreleaser.yaml for the signing switch.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          # Deploy keys of fleetlint/homebrew-tap, scoop-bucket and nur; unset on Gitea, which skips them.
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          SCOOP_DEPLOY_KEY: ${{ secrets.SCOOP_DEPLOY_KEY }}
          NUR_DEPLOY_KEY: ${{ secrets.NUR_DEPLOY_KEY }}

      - name: Build provenance attestation (SLSA, GitHub only)
        if: env.IS_GITHUB == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
