# The public demo at demo.fleetlint.org: fleetlint checking its own repositories.
# Copy this file and deploy/demo/pages.yml into the repository that publishes the demo.
version: 1
cache: .fleet-cache
repos:
  - url: https://github.com/fleetlint/fleetlint.git
    team: core
  - url: https://github.com/fleetlint/catalog.git
    team: core
  - url: https://github.com/fleetlint/docs.git
    team: docs
