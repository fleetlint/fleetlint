apiVersion: fleetlint.org/v1
kind: Catalog
metadata:
  name: fleetlint-recommended
  version: 0.1.0
  description: >
    The default for repositories you rely on: the task-runner contract,
    hook content, lint configuration per stack, changelog and CI basics.
  includes: [fleetlint:minimal]

rules:
  - id: repo/editorconfig
    title: .editorconfig is present
    kind: expr
    severity: warning
    scope: root
    expr: file(".editorconfig")
    message: ".editorconfig is missing"
    requirement: An .editorconfig declares charset, line endings, final newline and indentation.
    rationale: It stops formatting churn between editors before any formatter runs.
    fix:
      human: "Add .editorconfig with `root = true`; `fleetlint fix --apply` writes the template."
      agent: "Create .editorconfig: utf-8, lf, insert_final_newline, trim_trailing_whitespace, 2-space default with 4 for Go/Kotlin/Python/Rust/Dart."
      actions:
        - template: editorconfig
          to: .editorconfig

  - id: repo/gitattributes
    title: .gitattributes normalizes line endings
    kind: expr
    severity: warning
    scope: root
    expr: file(".gitattributes") && text(".gitattributes").contains("text=auto")
    message: ".gitattributes with `* text=auto` is missing"
    requirement: ".gitattributes sets `* text=auto eol=lf` and marks binaries."
    rationale: Prevents CRLF/LF diffs and corrupted binaries across operating systems.
    fix:
      human: "Add .gitattributes with `* text=auto eol=lf`; `fleetlint fix --apply` writes the template."
      agent: "Create .gitattributes with `* text=auto eol=lf` and `binary` for image, font, archive and media extensions."
      actions:
        - template: gitattributes
          to: .gitattributes

  - id: repo/lockfile-committed
    title: Dependency lockfile is committed
    kind: go
    severity: error
    tiers: [1, 2]
    requirement: Every stack's lockfile (go.sum, uv.lock/poetry.lock, Cargo.lock, package-lock.json/pnpm-lock.yaml/yarn.lock, pubspec.lock, gradle.lockfile) is tracked.
    rationale: Builds are reproducible only when dependency versions are pinned in git.
    fix:
      human: "Generate the lockfile with the package manager and commit it; remove it from .gitignore."
      agent: "Run the package manager to produce the lockfile, remove any .gitignore entry for it, and commit it."
    refs: ["docs/baseline.md#dependencies"]

  - id: repo/readme-present
    title: README exists and has a quickstart
    kind: expr
    severity: warning
    scope: root
    expr: >
      exists("README.md") && size(lines("README.md")) >= 10
      && text("README.md").matches('(?i)(## |### )?(install|quick ?start|getting started|usage|setup)')
    message: "README.md is missing or has no install/quickstart section"
    requirement: README.md says what the project is and how to install, run and test it.
    rationale: The first screen of the README must be enough to run the project.
    fix:
      human: "Write a README with purpose, requirements, quickstart and the task-runner targets."
      agent: "Write README.md: 2-3 sentence purpose, requirements, quickstart commands, the make targets, configuration table. Plain language, no marketing."
    refs: ["docs/baseline.md#documentation"]

  - id: taskrunner/targets
    title: Task runner exposes the contract targets
    kind: go
    severity: error
    tiers: [1, 2]
    scope: root
    params:
      required: [fmt, lint, test, cover, audit, check, check-fast]
    requirement: >
      The task runner (Makefile, or package.json scripts / Gradle where that is the stack's
      convention) exposes fmt, lint, test, cover, audit, check and check-fast, so every tool
      and person can run the same commands in every repository.
    rationale: "Hooks, CI and the agent rules all depend on `make check` meaning the same thing everywhere."
    fix:
      human: "Add the missing targets; `fleetlint fix --apply` writes a Makefile template when there is none."
      agent: "Add the missing targets to the Makefile following the template (SHELL bash -euo pipefail, .PHONY, help target). Fill each with the stack's real command, no TODO placeholders in check-fast or check."
      actions:
        - template: Makefile
    refs: ["docs/baseline.md#task-runner-contract"]

  - id: taskrunner/check-composition
    title: check runs the gates and excludes bench and release
    kind: expr
    severity: warning
    scope: root
    when: file("Makefile") && "check" in makefile("Makefile").targets
    expr: >
      ["lint", "test"].all(t, t in makefile("Makefile").deps["check"])
      && !("bench" in makefile("Makefile").deps["check"])
      && !("release" in makefile("Makefile").deps["check"])
    message: "`check` must depend on lint and test and must not include bench or release"
    requirement: "`make check` is the definition of green: lint, test, cover, audit and build. Benchmarks are noisy and release is a deliberate act, so neither is part of it."
    rationale: "A `check` that is slow or flaky gets bypassed, and a bypassed gate is worse than none."
    fix:
      human: "Set `check: lint test cover audit build` and move bench/release out."
      agent: "Rewrite the check target's prerequisites to `lint test cover audit build`; keep bench and release as separate targets."

  - id: hooks/shared-hygiene
    title: Hooks include the shared hygiene checks
    kind: expr
    severity: warning
    scope: root
    when: file(".pre-commit-config.yaml")
    expr: >
      yaml(".pre-commit-config.yaml").repos.exists(r,
        (r.repo == "builtin" || r.repo.contains("pre-commit-hooks"))
        && has(r.hooks)
        && ["trailing-whitespace", "end-of-file-fixer", "check-merge-conflict", "check-added-large-files"]
             .all(id, r.hooks.exists(h, h.id == id)))
    message: "hygiene hooks missing (trailing-whitespace, end-of-file-fixer, check-merge-conflict, check-added-large-files)"
    requirement: The hook config includes the shared hygiene block (whitespace, final newline, merge markers, large files).
    rationale: These catch the accidents no linter looks for, and the fixes are automatic.
    fix:
      human: "Add the `repo: builtin` block from templates/pre-commit-shared.yaml."
      agent: "Add the builtin hygiene hooks (trailing-whitespace, end-of-file-fixer, check-merge-conflict, check-added-large-files, detect-private-key) to .pre-commit-config.yaml."

  - id: hooks/conventional-commits
    title: Commit messages are checked
    kind: expr
    severity: warning
    scope: root
    when: file(".pre-commit-config.yaml")
    expr: >
      yaml(".pre-commit-config.yaml").repos.exists(r,
        r.repo.contains("conventional") || (has(r.hooks) && r.hooks.exists(h, h.id.contains("commit"))))
    message: "no commit-msg hook enforcing conventional commits"
    requirement: A commit-msg hook rejects messages that are not conventional commits.
    rationale: The changelog and version bump are generated from commit types; one bad message breaks both.
    fix:
      human: "Add the conventional-pre-commit hook with stages: [commit-msg]."
      agent: "Add compilerla/conventional-pre-commit to .pre-commit-config.yaml with stages: [commit-msg] and the allowed types."

  - id: hooks/pre-push-check
    title: Full check runs before push
    kind: expr
    severity: warning
    scope: root
    tiers: [1, 2]
    when: file(".pre-commit-config.yaml")
    expr: >
      yaml(".pre-commit-config.yaml").repos.exists(r, has(r.hooks) && r.hooks.exists(h,
        has(h.stages) && "pre-push" in h.stages && has(h.entry) && h.entry.contains("check")))
    message: "no pre-push hook runs the full check"
    requirement: "`make check` (or the stack's equivalent) runs as a pre-push hook."
    rationale: Pushing red is what breaks main for everyone else; the hook makes it impossible to do by accident.
    fix:
      human: "Add a local hook with entry `make check`, stages: [pre-push], always_run: true."
      agent: "Add a `repo: local` hook running `make check` at stage pre-push with pass_filenames: false and always_run: true."

  - id: changelog/present
    title: CHANGELOG.md exists
    kind: expr
    severity: warning
    scope: root
    tiers: [1, 2]
    expr: file("CHANGELOG.md")
    message: "CHANGELOG.md is missing"
    requirement: The repository keeps a CHANGELOG.md in Keep a Changelog format.
    rationale: Users and future you need to know what changed between versions without reading commits.
    fix:
      human: "Add cliff.toml and generate CHANGELOG.md with git-cliff."
      agent: "Add cliff.toml from the template and run `git-cliff -o CHANGELOG.md`."
      actions:
        - template: CHANGELOG.md

  - id: changelog/generator-configured
    title: Changelog generation is configured
    kind: expr
    severity: info
    scope: root
    tiers: [1]
    expr: file("cliff.toml") || (file(".goreleaser.yaml") && has(yaml(".goreleaser.yaml").changelog))
    message: "no changelog generator configured (cliff.toml or goreleaser changelog)"
    requirement: The changelog is generated from conventional commits (git-cliff or GoReleaser), then edited.
    rationale: Hand-written changelogs drift from the commits; generated ones can be trusted and edited.
    fix:
      human: "Add cliff.toml; `fleetlint fix --apply` writes the template."
      agent: "Add cliff.toml for git-cliff with Conventional Commits groups; `fleetlint fix --apply` writes the template."
      actions:
        - template: cliff.toml

  - id: ci/check-workflow
    title: CI runs the check
    kind: expr
    severity: warning
    scope: root
    tiers: [1, 2]
    expr: >
      glob(".github/workflows/*.y*ml").exists(w, text(w).contains("make check"))
      || glob(".gitea/workflows/*.y*ml").exists(w, text(w).contains("make check"))
      || glob(".github/workflows/*.y*ml").exists(w, text(w).contains("gradlew check") || text(w).contains("npm run check"))
    message: "no workflow runs the project's check"
    requirement: "A CI workflow runs the same `check` the hooks run, on pushes to main and on pull requests."
    rationale: CI is the record that main was green; it must run the same gate as local, not a different subset.
    fix:
      human: "Add a check workflow for the stack; `fleetlint fix --apply` writes the template."
      agent: "Add .github/workflows/check.yml from the stack template (toolchain setup, shared tools, make check)."
      actions:
        - template: "{stack}/check.yml"
          to: .github/workflows/check.yml
    refs: ["docs/baseline.md#continuous-integration"]

  - id: ci/least-privilege
    title: Workflows declare minimal permissions
    kind: expr
    severity: warning
    scope: root
    tiers: [1, 2]
    when: exists(".github/workflows/*.y*ml")
    foreach: glob(".github/workflows/*.y*ml")
    expr: yaml(item) != null && has(yaml(item).permissions)
    message: "workflow does not declare top-level permissions"
    requirement: "Every workflow sets top-level `permissions` (normally `contents: read`) and escalates per job only."
    rationale: The default token has write access to the repo; a compromised action in a read-only workflow can do far less.
    fix:
      human: "Add `permissions: { contents: read }` at the top of each workflow and widen per job."
      agent: "Add top-level `permissions:\\n  contents: read` to every workflow lacking it; move any wider permission to the job that needs it."
    refs: ["docs/baseline.md#security"]

  - id: ci/actions-pinned
    title: Actions are pinned to commit SHAs
    kind: go
    severity: warning
    scope: root
    tiers: [1]
    requirement: "Every `uses:` reference in a workflow is pinned to a full 40-character commit SHA with a version comment."
    rationale: A tag can be moved; a SHA cannot. Pinning is what makes a workflow reproducible and tamper-evident.
    fix:
      human: "Run `pinact run` and commit; let Renovate keep the pins current."
      agent: "Run `pinact run` to pin all uses: references to SHAs with version comments; do not change anything else in the workflows."
    refs: ["docs/baseline.md#security"]

  - id: lint/go-config
    title: golangci-lint is configured strictly
    kind: expr
    severity: warning
    stacks: [go]
    expr: >
      (file(".golangci.yml") || file(".golangci.yaml"))
      && (yaml(file(".golangci.yml") ? ".golangci.yml" : ".golangci.yaml").version == "2"
          || yaml(file(".golangci.yml") ? ".golangci.yml" : ".golangci.yaml").version == 2)
    message: "no golangci-lint v2 configuration (.golangci.yml with version: \"2\")"
    requirement: A golangci-lint v2 config enables errcheck, govet, staticcheck, errorlint, gosec, gocognit and funlen at least.
    rationale: Default linting misses the swallowed errors and oversized functions the baseline bans.
    fix:
      human: "Add .golangci.yml (version 2) from the Go stack profile."
      agent: "Create .golangci.yml with version: \"2\" and the linters listed in the Go stack profile, with a new-from-rev ratchet."
      actions:
        - template: golangci.yml
          to: .golangci.yml
    refs: ["docs/stacks.md#go"]

  - id: lint/python-config
    title: ruff and a strict type checker are configured
    kind: expr
    severity: warning
    stacks: [python]
    when: file("pyproject.toml")
    expr: >
      has(toml("pyproject.toml").tool.ruff)
      && (has(toml("pyproject.toml").tool.mypy) || has(toml("pyproject.toml").tool.pyright) || has(toml("pyproject.toml").tool.basedpyright))
    message: "pyproject.toml lacks [tool.ruff] or a type checker section"
    requirement: pyproject.toml configures ruff with a broad rule selection and mypy --strict or (based)pyright strict.
    rationale: Untyped Python with default linting is where AI-written code hides most bugs.
    fix:
      human: "Add [tool.ruff] and [tool.mypy] sections from the Python stack profile."
      agent: "Add [tool.ruff] with the profile's rule selection and [tool.mypy] strict = true to pyproject.toml; ratchet existing violations with `ruff check --add-noqa`."
    refs: ["docs/stacks.md#python"]

  - id: lint/rust-config
    title: clippy lints are configured in Cargo.toml
    kind: expr
    severity: warning
    stacks: [rust]
    expr: has(toml("Cargo.toml").lints) || has(toml("Cargo.toml").workspace.lints)
    message: "Cargo.toml has no [lints] table"
    requirement: Cargo.toml configures clippy (pedantic warn, unwrap_used/expect_used/panic deny outside tests) in a [lints] table.
    rationale: Unwrap-driven crashes are the Rust equivalent of swallowed errors.
    fix:
      human: "Add the [lints] table from the Rust stack profile."
      agent: "Add [lints.rust] and [lints.clippy] tables per the Rust profile to Cargo.toml."

  - id: lint/node-config
    title: TypeScript strict mode and a linter are configured
    kind: expr
    severity: warning
    stacks: [node]
    expr: >
      (file("tsconfig.json") && json("tsconfig.json").compilerOptions.strict == true)
      && (exists("eslint.config.*") || file("biome.json") || file("biome.jsonc"))
    message: "tsconfig strict mode or linter config (eslint.config.* / biome.json) is missing"
    requirement: "tsconfig.json has strict: true (plus noUncheckedIndexedAccess) and ESLint strictTypeChecked or Biome is configured."
    rationale: Without strict types and a type-aware linter, floating promises and any-typed code go unnoticed.
    fix:
      human: "Enable strict in tsconfig.json and add eslint.config.js per the Node stack profile."
      agent: "Set compilerOptions.strict and noUncheckedIndexedAccess in tsconfig.json; add eslint.config.js with typescript-eslint strictTypeChecked."

  - id: lint/flutter-config
    title: Dart analysis is strict
    kind: expr
    severity: warning
    stacks: [flutter]
    expr: >
      file("analysis_options.yaml")
      && has(yaml("analysis_options.yaml").analyzer.language)
      && yaml("analysis_options.yaml").analyzer.language["strict-casts"] == true
    message: "analysis_options.yaml lacks strict-casts/strict-inference/strict-raw-types"
    requirement: analysis_options.yaml enables strict-casts, strict-inference and strict-raw-types and does not disable use_build_context_synchronously or unawaited_futures.
    rationale: Those three switches are what turn Dart's analyzer from advisory into a type checker.
    fix:
      human: "Set analyzer.language strict-* to true and include very_good_analysis."
      agent: "Edit analysis_options.yaml: include very_good_analysis, set analyzer.language strict-casts/strict-inference/strict-raw-types true, remove rules that disable use_build_context_synchronously or unawaited_futures."

  - id: lint/kotlin-config
    title: detekt is configured
    kind: expr
    severity: warning
    stacks: [kotlin]
    expr: exists("**/detekt*.yml") || exists("**/detekt*.yaml") || exists("config/detekt/*")
    message: "no detekt configuration found"
    requirement: detekt runs with a config enforcing EmptyCatchBlock, SwallowedException, LongMethod and complexity limits.
    rationale: Kotlin's compiler accepts swallowed exceptions; detekt is where they are caught.
    fix:
      human: "Add config/detekt/detekt.yml and the detekt Gradle plugin."
      agent: "Add the detekt Gradle plugin with buildUponDefaultConfig and a config/detekt/detekt.yml enabling the rules from the Kotlin stack profile."

  - id: public/license
    title: Public repository has a LICENSE
    kind: expr
    severity: error
    scope: root
    when: repo.public
    expr: exists("LICENSE*") || exists("COPYING*")
    message: "LICENSE file is missing"
    requirement: A public repository has a LICENSE file (and an SPDX identifier in the package manifest).
    rationale: Without a license, nobody may legally use the code.
    fix:
      human: "Add LICENSE (MIT or Apache-2.0) with the current year and your name."
      agent: "Ask the user which license; add the LICENSE file and the SPDX identifier to the package manifest."

  - id: public/security-policy
    title: Public repository has SECURITY.md
    kind: expr
    severity: warning
    scope: root
    when: repo.public && repo.tier == 1
    expr: file("SECURITY.md") || file(".github/SECURITY.md")
    message: "SECURITY.md is missing"
    requirement: SECURITY.md explains how to report a vulnerability privately.
    rationale: Reporters otherwise open public issues, which disclose the problem before a fix exists.
    fix:
      human: "Add SECURITY.md with a private contact and expected response time."
      agent: "Add SECURITY.md: supported versions, private reporting channel, response expectation."
      actions:
        - template: SECURITY.md

  - id: quality/check-passes
    title: The repository's own check passes within budget
    kind: go
    severity: error
    tiers: [1, 2]
    scope: root
    params:
      budget: 10m
    requirement: "`make check` (or the task runner's equivalent) exits 0 and finishes within the budget (default 10 minutes). Evaluated only with `--deep`, because it runs the repository's code."
    rationale: A gate that is red or slow gets bypassed. Measuring it is the only way to know it still works.
    fix:
      human: "Run `make check` locally and fix what fails; if it is slow, cache or parallelize before adding more gates."
      agent: "Run `make check`, read the failing step's output, fix the cause (never the gate), re-run until green. If over budget, profile the slowest target and parallelize or cache it."

  - id: release/sbom
    title: Releases publish an SBOM
    kind: outcome
    severity: error
    tiers: [1]
    scope: root
    when: release.exists
    satisfiers:
      - name: goreleaser
        when: file(".goreleaser.yaml") || file(".goreleaser.yml")
        expr: >
          has(yaml(file(".goreleaser.yaml") ? ".goreleaser.yaml" : ".goreleaser.yml").sboms)
      - name: workflow-action
        expr: >
          tagged_workflows().exists(w, steps(w).exists(s,
            s.uses.startsWith("anchore/sbom-action") || s.uses.startsWith("CycloneDX/")))
      - name: workflow-command
        expr: >
          tagged_workflows().exists(w, steps(w).exists(s,
            s.run.matches("\\b(syft|cyclonedx-[a-z]+|trivy sbom|cargo (sbom|cyclonedx)|npm sbom|cdxgen)\\b")))
      - name: make-target
        when: taskrunner.kind == "make"
        expr: >
          ("sbom" in makefile("Makefile").targets || "dist" in makefile("Makefile").targets)
          && tagged_workflows().exists(w, steps(w).exists(s, s.run.matches("make (sbom|dist)\\b")))
      - name: build-plugin
        expr: >
          (file("build.gradle.kts") && text("build.gradle.kts").contains("cyclonedx"))
          || (file("package.json") && text("package.json").contains("@cyclonedx/cyclonedx-npm"))
          || (file("Cargo.toml") && text("Cargo.toml").contains("cyclonedx"))
      - name: container
        expr: >
          tagged_workflows().exists(w, steps(w).exists(s,
            s.uses.startsWith("docker/build-push-action") && "sbom" in s.with && string(s.with.sbom) == "true"))
    partials:
      - name: sbom-outside-release
        severity: warning
        expr: >
          (taskrunner.kind == "make" && "sbom" in makefile("Makefile").targets)
          || workflows().exists(w, steps(w).exists(s, s.run.matches("\\bsyft\\b") || s.uses.startsWith("anchore/sbom-action")))
        message: "an SBOM producer exists but no tag-triggered release workflow invokes it"
    message: "no release step generates an SBOM"
    requirement: >
      Every release produces an SPDX or CycloneDX SBOM for its artifacts, generated inside
      the release pipeline and published alongside them. Any recognised producer counts:
      GoReleaser `sboms:`, anchore/sbom-action or CycloneDX actions, syft/cyclonedx/trivy
      commands, a Makefile `sbom` target the release workflow calls, a build-tool plugin,
      or `docker/build-push-action` with `sbom: true`. Repositories add producers with `accept:`.
    rationale: >
      Consumers and scanners need to know what is inside an artifact; generating the SBOM
      in the pipeline ties it to the exact build.
    fix:
      human: "Add an SBOM step to the tag-triggered release workflow (syft, SPDX JSON, one per artifact) or a `sboms:` section to .goreleaser.yaml, and upload the files with the release."
      agent: "In the tag-triggered release workflow add a step running syft on each artifact producing SPDX JSON files, and include them in the release upload step. Do not change other steps. If the repo uses GoReleaser, add a `sboms:` section instead."
    refs: ["docs/baseline.md#releases"]

  # ---------------------------------------------------------------- 1.0 additions

  - id: repo/no-large-files
    title: No large files are tracked outside git-lfs
    kind: expr
    severity: warning
    scope: root
    params:
      max_kb: 2048
    foreach: tracked()
    expr: >
      filesize(item) <= params.max_kb * 1024
      || lines(".gitattributes").exists(l, l.contains("filter=lfs") && globmatch(l.split(" ")[0], item))
    message: "tracked file is larger than the limit and not in git-lfs"
    requirement: "No tracked file exceeds `max_kb` (default 2 MiB) unless its pattern is routed to git-lfs in .gitattributes."
    rationale: Binaries in history make every clone slower forever; lfs or a release asset is the right home.
    fix:
      human: "Move the file to git-lfs (`git lfs track <pattern>`) or publish it as a release asset and remove it from history."
      agent: "Report the file; do not rewrite history. Suggest `git lfs track` for the pattern or an external home for the file."
    refs: ["docs/baseline.md#hygiene"]

  - id: repo/codeowners
    title: CODEOWNERS names reviewers
    kind: expr
    severity: info
    scope: root
    tiers: [1]
    expr: file("CODEOWNERS") || file(".github/CODEOWNERS") || file("docs/CODEOWNERS") || file(".gitea/CODEOWNERS")
    message: "no CODEOWNERS file"
    requirement: A CODEOWNERS file routes review requests for every path.
    rationale: Review ownership that lives in people's heads does not survive a holiday.
    fix:
      human: "Add .github/CODEOWNERS with a default owner line."
      agent: "Add .github/CODEOWNERS containing `* @<owner>` and commit."

  - id: lint/go-linters-enabled
    title: golangci-lint enables the baseline linters
    kind: expr
    severity: warning
    stacks: [go]
    when: file(".golangci.yml") || file(".golangci.yaml")
    params:
      required: [errcheck, govet, staticcheck, errorlint, gosec, gocognit, funlen]
    foreach: params.required
    expr: >
      yaml(file(".golangci.yml") ? ".golangci.yml" : ".golangci.yaml") != null
      && has(yaml(file(".golangci.yml") ? ".golangci.yml" : ".golangci.yaml").linters)
      && (
        (has(yaml(file(".golangci.yml") ? ".golangci.yml" : ".golangci.yaml").linters.default)
          && yaml(file(".golangci.yml") ? ".golangci.yml" : ".golangci.yaml").linters.default == "all")
        || (has(yaml(file(".golangci.yml") ? ".golangci.yml" : ".golangci.yaml").linters.default)
          && yaml(file(".golangci.yml") ? ".golangci.yml" : ".golangci.yaml").linters.default == "standard"
          && item in ["errcheck", "govet", "staticcheck", "unused", "ineffassign"])
        || (has(yaml(file(".golangci.yml") ? ".golangci.yml" : ".golangci.yaml").linters.enable)
          && item in yaml(file(".golangci.yml") ? ".golangci.yml" : ".golangci.yaml").linters.enable)
      )
    message: "required linter is not enabled"
    requirement: "The golangci-lint configuration enables every linter in `params.required`, directly or through `default: all`."
    rationale: Swallowed errors, unsafe calls and oversized functions are exactly what these linters catch.
    fix:
      human: "Add the missing linters to linters.enable in .golangci.yml."
      agent: "Add each reported linter to the linters.enable list in .golangci.yml; keep the rest of the file unchanged."
    refs: ["docs/stacks.md#go"]

  - id: quality/no-slop-markers
    title: Documentation is free of marketing filler
    kind: expr
    severity: warning
    scope: root
    foreach: >
      grep("**/*.md", "\\b(seamless(ly)?|blazing(ly)?[- ]fast|robust|powerful|comprehensive|cutting[- ]edge|state[- ]of[- ]the[- ]art|leverag(e|es|ing)|effortless(ly)?|supercharge|game[- ]chang(er|ing)|world[- ]class|delve|elevate)\\b")
    expr: item.path.endsWith("CHANGELOG.md")
    message: "marketing filler in documentation"
    requirement: READMEs and docs describe what the software does and how to use it, without the adjectives from the slop catalog.
    rationale: Filler words are the most recognisable trace of generated prose and say nothing a reader can act on.
    fix:
      human: "Rewrite the line to state the concrete behaviour; delete the adjective."
      agent: "Rewrite each flagged line without the flagged word, keeping the technical content; do not add new adjectives."
    refs: ["docs/baseline.md#documentation"]

  - id: quality/coverage-threshold
    title: A coverage floor is enforced
    kind: outcome
    severity: warning
    scope: root
    tiers: [1, 2]
    satisfiers:
      - name: make-cover
        when: taskrunner.kind == "make" && "cover" in makefile("Makefile").targets
        expr: >
          makefile("Makefile").recipes["cover"].exists(l,
            l.matches("fail[-_]?under|coverageThreshold|min(imum)?[-_]?coverage|COVER(AGE)?_MIN|-lt|< *\\$|diff-cover"))
      - name: codecov
        expr: >
          (file(".codecov.yml") && text(".codecov.yml").contains("target"))
          || (file("codecov.yml") && text("codecov.yml").contains("target"))
      - name: pytest
        when: file("pyproject.toml")
        expr: text("pyproject.toml").matches("fail[-_]under")
      - name: jest-or-vitest
        expr: >
          (file("package.json") && text("package.json").contains("coverageThreshold"))
          || exists("jest.config.*") && glob("jest.config.*").exists(f, text(f).contains("coverageThreshold"))
          || exists("vitest.config.*") && glob("vitest.config.*").exists(f, text(f).contains("thresholds"))
      - name: kover-or-jacoco
        expr: >
          exists("**/build.gradle.kts") && glob("**/build.gradle.kts").exists(f, text(f).matches("minBound|minimum = |violationRules"))
      - name: cargo-llvm-cov
        expr: exists("**/*.toml") && (file("Makefile") && text("Makefile").contains("--fail-under"))
    message: "nothing enforces a minimum coverage"
    requirement: >
      The `cover` target (or the CI coverage tool) fails below a floor: a total or diff-coverage threshold
      in the Makefile recipe, codecov `target`, pytest `--cov-fail-under`, Jest/Vitest thresholds,
      Kover/JaCoCo verification rules, or `cargo llvm-cov --fail-under`.
    rationale: A coverage number nobody enforces drifts down one "quick fix" at a time.
    fix:
      human: "Make `make cover` fail below the floor (diff-cover --fail-under=80 is the stack-neutral option)."
      agent: "Add a threshold to the cover recipe using the stack profile's tool (go: cover.sh with a minimum; python: --cov-fail-under; node: coverageThreshold; rust: cargo llvm-cov --fail-under; kotlin: kover verify)."
    refs: ["docs/baseline.md#tests"]

  - id: docs/architecture
    title: Architecture is documented
    kind: expr
    severity: warning
    scope: root
    tiers: [1]
    expr: >
      file("docs/ARCHITECTURE.md") || file("ARCHITECTURE.md")
      || (file("README.md") && scan("README.md", "(?i)^#+\\s*architecture").size() > 0)
    message: "no architecture document or README section"
    requirement: docs/ARCHITECTURE.md (or an Architecture section in the README) explains the components, their boundaries and the data flow in one page.
    rationale: The shape of the system is the one thing a newcomer cannot recover from the code quickly.
    fix:
      human: "Write docs/ARCHITECTURE.md: components, boundaries, data flow, the three decisions that shaped it."
      agent: "Write docs/ARCHITECTURE.md from the actual package structure: one paragraph per component, one diagram, no marketing."
    refs: ["docs/baseline.md#documentation"]

  - id: docs/adr-directory
    title: Decisions are recorded as ADRs
    kind: expr
    severity: info
    scope: root
    tiers: [1]
    expr: exists("docs/adr/*.md") || exists("docs/decisions/*.md") || exists("adr/*.md") || exists("docs/adrs/*.md")
    message: "no architecture decision records"
    requirement: Significant decisions live in docs/adr/NNNN-title.md (context, decision, consequences).
    rationale: Without the why, the next person re-litigates every settled question.
    fix:
      human: "Add docs/adr/0001-record-architecture-decisions.md and one ADR per existing major decision."
      agent: "Create docs/adr/0001-record-architecture-decisions.md in MADR format; list the decisions already visible in the code as candidates."

  - id: deps/update-automation
    title: Dependency updates are automated
    kind: expr
    severity: warning
    scope: root
    tiers: [1, 2]
    expr: >
      exists("renovate.json*") || exists(".renovaterc*") || exists(".github/renovate.json*")
      || file(".github/dependabot.yml") || file(".gitea/dependabot.yml") || file(".gitlab/renovate.json")
    message: "no Renovate or Dependabot configuration"
    requirement: Renovate (preferred, works on GitHub and Gitea) or Dependabot keeps dependencies and pinned actions current.
    rationale: Unpinned is unsafe and pinned-but-stale is unsafe too; only automation keeps both true.
    fix:
      human: "Add renovate.json extending config:recommended with the pinned-actions preset."
      agent: "Add renovate.json: {\"$schema\": \"https://docs.renovatebot.com/renovate-schema.json\", \"extends\": [\"config:recommended\", \"helpers:pinGitHubActionDigests\"]}."
    refs: ["docs/baseline.md#dependencies"]

  - id: ci/job-timeouts
    title: Workflow jobs have timeouts
    kind: expr
    severity: info
    scope: root
    when: workflows().size() > 0
    foreach: workflows()
    expr: jobs(item).all(j, j.timeout_minutes > 0 || j.uses != "")
    message: "a job has no timeout-minutes"
    requirement: "Every job sets `timeout-minutes` (reusable-workflow jobs excepted) so a hang cannot burn the runner budget."
    rationale: The default job timeout is six hours.
    fix:
      human: "Add `timeout-minutes: 15` (or what the job needs) to each job."
      agent: "Add timeout-minutes to each job in the flagged workflow, sized to roughly twice its typical duration."

  - id: ci/concurrency-cancel
    title: PR workflows cancel superseded runs
    kind: expr
    severity: info
    scope: root
    when: workflows().exists(w, "pull_request" in triggers(w))
    foreach: workflows().filter(w, "pull_request" in triggers(w))
    expr: >
      yaml(item) != null && has(yaml(item).concurrency)
      && yaml(item).concurrency["cancel-in-progress"] != false
    message: "pull-request workflow has no concurrency group with cancel-in-progress"
    requirement: "Workflows triggered by pull requests declare `concurrency: {group: ..., cancel-in-progress: true}`."
    rationale: Every push to a PR otherwise queues another full run behind the obsolete one.
    fix:
      human: "Add a concurrency block keyed on the workflow and ref with cancel-in-progress: true."
      agent: "Add `concurrency:\\n  group: ${{ github.workflow }}-${{ github.ref }}\\n  cancel-in-progress: true` at the top level of the workflow."

  - id: ci/no-pull-request-target
    title: pull_request_target never runs untrusted code
    kind: expr
    severity: error
    scope: root
    when: repo.public && workflows().exists(w, "pull_request_target" in triggers(w))
    foreach: workflows().filter(w, "pull_request_target" in triggers(w))
    expr: >
      !steps(item).exists(s, s.uses.startsWith("actions/checkout")
        && has(s.with.ref) && string(s.with.ref).matches("head|pull_request"))
    message: "pull_request_target workflow checks out the pull request head"
    requirement: "A `pull_request_target` workflow runs with repository secrets and must never check out or execute the PR's code."
    rationale: This is the canonical workflow injection, used in real supply-chain attacks.
    fix:
      human: "Use `pull_request` for anything that builds the PR; keep pull_request_target for labelling only."
      agent: "Change the trigger to pull_request, or remove the checkout of the PR head from the pull_request_target workflow."
    refs: ["docs/baseline.md#security"]

  - id: release/signing
    title: Release artifacts are signed
    kind: outcome
    severity: error
    tiers: [1]
    scope: root
    when: release.exists && tagged_workflows().size() > 0
    satisfiers:
      - name: goreleaser-signs
        when: file(".goreleaser.yaml") || file(".goreleaser.yml")
        expr: >
          has(yaml(file(".goreleaser.yaml") ? ".goreleaser.yaml" : ".goreleaser.yml").signs)
          || has(yaml(file(".goreleaser.yaml") ? ".goreleaser.yaml" : ".goreleaser.yml").binary_signs)
      - name: cosign-in-workflow
        expr: >
          tagged_workflows().exists(w, steps(w).exists(s, s.uses.startsWith("sigstore/cosign-installer"))
            && steps(w).exists(s, s.run.matches("cosign (sign|sign-blob|attest)")))
      - name: sigstore-python
        expr: tagged_workflows().exists(w, steps(w).exists(s, s.uses.startsWith("sigstore/gh-action-sigstore-python")))
      - name: npm-provenance
        expr: tagged_workflows().exists(w, steps(w).exists(s, s.run.matches("npm publish.*--provenance")))
      - name: gpg
        expr: tagged_workflows().exists(w, steps(w).exists(s, s.run.matches("gpg .*(--detach-sign|-b\\b)")))
    partials:
      - name: cosign-outside-release
        severity: warning
        expr: workflows().exists(w, steps(w).exists(s, s.uses.startsWith("sigstore/cosign-installer") || s.run.contains("cosign ")))
        message: "cosign is installed in a workflow but no tag-triggered release signs its artifacts"
    message: "release artifacts are not signed"
    requirement: >
      Every release signs its artifacts: cosign keyless (OIDC) on GitHub, key-based cosign on Gitea,
      GoReleaser `signs:`, sigstore-python for wheels, or npm provenance. Signatures are published with the release.
      A container image is signed by digest with `cosign sign`.
    rationale: Checksums prove integrity; only a signature proves who built it.
    fix:
      human: "Add a cosign step to the release workflow: `cosign sign-blob` for checksums.txt when the release is files, `cosign sign <image>@<digest>` when it is a container image (keyless on GitHub, with a key on Gitea)."
      agent: "Add sigstore/cosign-installer and a signing step after the artifacts are built. Files: `cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt` and upload the bundle. Container image: `cosign sign --yes <image>@<digest>` using the digest output of the build step, with `id-token: write` on the job."
    refs: ["docs/baseline.md#releases"]

  - id: release/provenance
    title: Releases attest build provenance
    kind: outcome
    severity: warning
    tiers: [1]
    scope: root
    when: release.exists && tagged_workflows().size() > 0
    satisfiers:
      - name: attest-action
        expr: tagged_workflows().exists(w, steps(w).exists(s, s.uses.startsWith("actions/attest-build-provenance") || s.uses.startsWith("actions/attest@")))
      - name: slsa-generator
        expr: tagged_workflows().exists(w, steps(w).exists(s, s.uses.startsWith("slsa-framework/")) || jobs(w).exists(j, j.uses.startsWith("slsa-framework/")))
      - name: cosign-attest
        expr: tagged_workflows().exists(w, steps(w).exists(s, s.run.contains("cosign attest")))
      - name: npm-provenance
        expr: tagged_workflows().exists(w, steps(w).exists(s, s.run.matches("npm publish.*--provenance")))
      - name: container-provenance
        expr: >
          tagged_workflows().exists(w, steps(w).exists(s,
            s.uses.startsWith("docker/build-push-action")
            && (("provenance" in s.with && string(s.with.provenance) != "false") || "attests" in s.with)))
    message: "no build provenance attestation in the release pipeline"
    requirement: The release pipeline produces a SLSA provenance attestation (actions/attest-build-provenance, the SLSA generator, cosign attest or npm provenance).
    rationale: Provenance ties the artifact to the exact source and workflow that built it, which a signature alone does not.
    fix:
      human: "Add actions/attest-build-provenance (GitHub) or `cosign attest --predicate` (Gitea) to the release workflow."
      agent: "Add a step `uses: actions/attest-build-provenance` with `subject-path` covering the release artifacts; grant `id-token: write` and `attestations: write` to that job only."

  - id: release/tag-triggered
    title: Releases run from a tag-triggered workflow
    kind: expr
    severity: error
    tiers: [1]
    scope: root
    when: release.mechanisms.exists(m, m != "git-cliff")
    expr: tagged_workflows().size() > 0
    message: "a release mechanism exists but no workflow is triggered by tag pushes"
    requirement: "Releases are produced by CI from a `v*` tag, never from a laptop."
    rationale: A release built locally has no provenance and cannot be reproduced.
    fix:
      human: "Add release.yml triggered on push.tags ['v*'] that runs the release tool; `fleetlint fix --apply` writes the stack's template (GoReleaser for Go and Rust, `make dist` plus syft and cosign otherwise) as a starting point."
      agent: "Add .github/workflows/release.yml (or .gitea/workflows/) with `on: push: tags: ['v*']` running the existing release tool; keep permissions minimal. Adapt the template to the release tool already in the repository instead of replacing it."
      actions:
        - template: "{stack}/release.yml"
          to: .github/workflows/release.yml
    refs: ["docs/baseline.md#releases"]

  - id: release/semver-tags
    title: Tags are semantic versions
    kind: expr
    severity: warning
    scope: root
    when: repo.has_git && tags().size() > 0
    foreach: tags()
    expr: item.matches("^([A-Za-z0-9_.-]+/)?v?[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$")
    message: "tag is not a semantic version"
    requirement: "Every tag is `vMAJOR.MINOR.PATCH[-prerelease]`, optionally prefixed with a component name and slash in monorepos."
    rationale: Release tooling, changelog generation and dependency resolvers all key on the pattern.
    fix:
      human: "Delete or rename the offending tags; tag releases as vX.Y.Z from now on."
      agent: "List the offending tags for the user; do not delete tags without confirmation."

  - id: release/checksums
    title: Releases publish checksums
    kind: outcome
    severity: warning
    tiers: [1]
    scope: root
    when: release.exists && tagged_workflows().size() > 0
    satisfiers:
      - name: goreleaser
        when: file(".goreleaser.yaml") || file(".goreleaser.yml")
        expr: >
          !(has(yaml(file(".goreleaser.yaml") ? ".goreleaser.yaml" : ".goreleaser.yml").checksum)
            && has(yaml(file(".goreleaser.yaml") ? ".goreleaser.yaml" : ".goreleaser.yml").checksum.disable)
            && yaml(file(".goreleaser.yaml") ? ".goreleaser.yaml" : ".goreleaser.yml").checksum.disable == true)
      - name: workflow-command
        expr: tagged_workflows().exists(w, steps(w).exists(s, s.run.matches("sha256sum|shasum -a 256|sha512sum|b2sum")))
      - name: python-publish
        expr: tagged_workflows().exists(w, steps(w).exists(s, s.uses.startsWith("pypa/gh-action-pypi-publish")))
      - name: container-image
        expr: tagged_workflows().exists(w, steps(w).exists(s, s.uses.startsWith("docker/build-push-action")))
    message: "the release publishes no checksums file"
    requirement: A checksums.txt (sha256) covering every artifact is uploaded with the release, and is what gets signed. A container image pushed to a registry is addressed by its digest and needs no separate file.
    rationale: Checksums let a downloader verify integrity even without signature tooling.
    fix:
      human: "Generate checksums.txt with sha256sum in the release job and upload it."
      agent: "Add `sha256sum dist/* > dist/checksums.txt` before the upload step and include dist/checksums.txt in the release assets."

  - id: release/changelog-in-release
    title: Release notes are generated from commits
    kind: outcome
    severity: info
    tiers: [1]
    scope: root
    when: release.exists && tagged_workflows().size() > 0
    satisfiers:
      - name: goreleaser-changelog
        when: file(".goreleaser.yaml") || file(".goreleaser.yml")
        expr: >
          !(has(yaml(file(".goreleaser.yaml") ? ".goreleaser.yaml" : ".goreleaser.yml").changelog)
            && has(yaml(file(".goreleaser.yaml") ? ".goreleaser.yaml" : ".goreleaser.yml").changelog.disable)
            && yaml(file(".goreleaser.yaml") ? ".goreleaser.yaml" : ".goreleaser.yml").changelog.disable == true)
      - name: git-cliff
        expr: tagged_workflows().exists(w, steps(w).exists(s, s.uses.startsWith("orhun/git-cliff-action") || s.run.contains("git-cliff")))
      - name: release-please-or-changesets
        expr: workflows().exists(w, steps(w).exists(s, s.uses.startsWith("googleapis/release-please-action") || s.uses.startsWith("changesets/action")))
    message: "release notes are not generated from the commit history"
    requirement: Release notes come from git-cliff, GoReleaser's changelog, release-please or changesets, so they match the CHANGELOG.
    rationale: Hand-written release notes drift from the changelog and from what was shipped.
    fix:
      human: "Use git-cliff --latest --strip header as the release body."
      agent: "Add a step that runs `git-cliff --latest --strip header -o release-notes.md` and pass it as the release body."

  - id: public/contributing
    title: Public repository explains how to contribute
    kind: expr
    severity: info
    scope: root
    tiers: [1]
    when: repo.public
    expr: exists("CONTRIBUTING*") || exists(".github/CONTRIBUTING*") || exists("docs/CONTRIBUTING*")
    message: "CONTRIBUTING.md is missing"
    requirement: "CONTRIBUTING.md states how to set up, run `make check`, and what a pull request needs."
    rationale: It is the difference between a drive-by issue and a merged fix.
    fix:
      human: "Add CONTRIBUTING.md: setup, make check, commit convention, PR expectations."
      agent: "Write CONTRIBUTING.md from the Makefile targets and hook configuration actually present; keep it under one page."

  - id: public/code-of-conduct
    title: Public repository has a code of conduct
    kind: expr
    severity: info
    scope: root
    tiers: [1]
    when: repo.public
    expr: exists("CODE_OF_CONDUCT*") || exists(".github/CODE_OF_CONDUCT*")
    message: "CODE_OF_CONDUCT.md is missing"
    requirement: A code of conduct (Contributor Covenant is fine) with a contact address.
    rationale: Forges surface it in the community profile; contributors look for it before engaging.
    fix:
      human: "Add CODE_OF_CONDUCT.md (Contributor Covenant 2.1) with a contact address."
      agent: "Add CODE_OF_CONDUCT.md using the Contributor Covenant 2.1 text; ask the user for the contact address."

  - id: repo/toolchain-pinned
    title: Toolchain version is pinned
    kind: expr
    severity: warning
    tiers: [1, 2]
    foreach: repo.stacks
    expr: >
      (item != "go" || scan("go.mod", "^(toolchain go\\d+\\.\\d+|go \\d+\\.\\d+\\.\\d+)").size() > 0)
      && (item != "python" || file(".python-version") || file(".tool-versions") || file("mise.toml"))
      && (item != "rust" || file("rust-toolchain.toml") || file("rust-toolchain"))
      && (item != "node" || file(".nvmrc") || file(".node-version") || file(".tool-versions") || file("mise.toml") || scan("package.json", "\"volta\"\\s*:").size() > 0)
      && (item != "kotlin" || file("gradle/wrapper/gradle-wrapper.properties"))
      && (item != "flutter" || file(".fvmrc") || file(".fvm/fvm_config.json") || file(".tool-versions") || file("mise.toml"))
    message: "the toolchain version for this stack is not pinned in the repository"
    requirement: "Each stack pins its toolchain in a file the tools read: a `toolchain` directive or a full `go 1.x.y` version in go.mod, `.python-version`, `rust-toolchain.toml`, `.nvmrc` or `.node-version`, the Gradle wrapper, `.fvmrc`; `.tool-versions` or `mise.toml` also count."
    rationale: Without a pin, every machine and every CI run builds with whatever compiler or runtime happens to be installed, and failures cannot be reproduced.
    fix:
      human: "Add the stack's version file with the version you build with today."
      agent: "Add the stack's toolchain pin (go.mod toolchain directive, .python-version, rust-toolchain.toml, .nvmrc, Gradle wrapper, .fvmrc) set to the version currently installed; do not upgrade the toolchain in the same change."
    refs: ["docs/baseline.md#hygiene", "docs/stacks.md"]

  - id: deps/vulnerability-scan
    title: Dependencies are scanned for known vulnerabilities
    kind: expr
    severity: warning
    scope: root
    tiers: [1, 2]
    expr: >
      ["Makefile", "package.json", "build.gradle", "build.gradle.kts", "justfile", "Taskfile.yml"].exists(f,
        text(f).matches("govulncheck|pip-audit|cargo[- ]deny|cargo[- ]audit|(npm|pnpm|yarn|yarn npm|bun) audit|osv-scanner|trivy|grype|dependency-check|dependencyCheck|snyk test"))
      || workflows().exists(w,
        text(w).matches("govulncheck|pip-audit|cargo[- ]deny|cargo[- ]audit|(npm|pnpm|yarn|yarn npm|bun) audit|osv-scanner|trivy|grype|dependency-check|dependencyCheck|snyk test|dependency-review-action"))
    message: "no vulnerability scanner runs in the task runner or in CI"
    requirement: "The `audit` target or a CI workflow runs a dependency vulnerability scanner: govulncheck, pip-audit, cargo deny or cargo audit, npm/pnpm/yarn audit, osv-scanner, trivy, grype, OWASP dependency-check."
    rationale: A lockfile pins yesterday's versions; only a scan says which of them are known to be exploitable today.
    fix:
      human: "Add the stack's scanner to the `audit` target (see docs/stacks.md) so `make check` runs it."
      agent: "Add the stack's vulnerability scanner to the audit target of the task runner; use osv-scanner against the lockfile when the stack has no native tool. Do not fix the findings in the same change; list them."
    refs: ["docs/baseline.md#dependencies"]

  - id: deps/license-check
    title: Dependency licenses are checked against an allowlist
    kind: expr
    severity: info
    scope: root
    tiers: [1]
    expr: >
      ["Makefile", "package.json", "build.gradle", "build.gradle.kts", "justfile", "Taskfile.yml", "deny.toml"].exists(f,
        text(f).matches("go-licenses|pip-licenses|cargo[- ]deny|\\[licenses\\]|license-checker|licensee|osv-scanner[^\\n]*licenses|reuse lint|scancode|trivy[^\\n]*license|fossa"))
      || workflows().exists(w,
        text(w).matches("go-licenses|pip-licenses|cargo[- ]deny|license-checker|licensee|osv-scanner[^\\n]*licenses|reuse lint|scancode|trivy[^\\n]*license|fossa|dependency-review-action"))
    message: "no license check runs in the task runner or in CI"
    requirement: "The `audit` target or a CI workflow checks dependency licenses against an allowlist: go-licenses, pip-licenses, cargo deny, license-checker, licensee, osv-scanner with license scanning."
    rationale: A dependency under an incompatible license is found cheaply before it is merged and expensively after a release.
    fix:
      human: "Add the stack's license checker with an allowlist to the `audit` target (see docs/stacks.md)."
      agent: "Add the stack's license checker to the audit target with an allowlist compatible with the repository's own license; report dependencies outside it instead of widening the list."
    refs: ["docs/baseline.md#dependencies"]

  - id: deps/install-scripts-disabled
    title: Package install scripts are disabled
    kind: expr
    severity: info
    stacks: [node]
    tiers: [1, 2]
    expr: >
      scan(".npmrc", "^\\s*ignore-scripts\\s*=\\s*true").size() > 0
      || scan(".yarnrc.yml", "^\\s*enableScripts:\\s*false").size() > 0
      || text("pnpm-workspace.yaml").contains("onlyBuiltDependencies")
      || text("package.json").contains("onlyBuiltDependencies")
      || text("package.json").contains("trustedDependencies")
    message: "dependencies may run install scripts"
    requirement: "Install scripts of dependencies do not run by default: `ignore-scripts=true` in .npmrc, `enableScripts: false` in .yarnrc.yml, or an explicit allowlist (`onlyBuiltDependencies` for pnpm, `trustedDependencies` for bun)."
    rationale: Install scripts are the usual way a compromised package executes code on developer machines and in CI.
    fix:
      human: "Add `ignore-scripts=true` to .npmrc and allow the few packages that need a build step explicitly."
      agent: "Add ignore-scripts=true to .npmrc (or the package manager's equivalent), run a clean install and the tests, and list the packages that need their build script allowed."
    refs: ["docs/baseline.md#dependencies"]

  - id: lint/shell
    title: Shell scripts are linted
    kind: expr
    severity: info
    scope: root
    when: tracked().exists(p, p.endsWith(".sh"))
    expr: >
      text(".pre-commit-config.yaml").contains("shellcheck")
      || text("Makefile").contains("shellcheck")
      || workflows().exists(w, text(w).contains("shellcheck"))
    message: "shell scripts are tracked but shellcheck runs nowhere"
    requirement: "When the repository contains shell scripts, shellcheck runs as a hook, in the `lint` target or in CI."
    rationale: Unquoted variables and unchecked exit codes are the bugs shell scripts ship with, and shellcheck finds them without running anything.
    fix:
      human: "Add the shellcheck hook to .pre-commit-config.yaml."
      agent: "Add the shellcheck hook (and shfmt) to .pre-commit-config.yaml and fix what it reports in the tracked scripts."
    refs: ["docs/baseline.md#static-analysis"]

  - id: containers/dockerignore
    title: Container builds have a .dockerignore
    kind: expr
    severity: warning
    scope: root
    when: tracked().exists(p, p.matches("(^|/)(Dockerfile|Containerfile)[^/]*$"))
    expr: file(".dockerignore") || file(".containerignore") || exists("*.dockerignore")
    message: "a Dockerfile is tracked but there is no .dockerignore"
    requirement: "A repository with a Dockerfile has a `.dockerignore` that keeps `.git`, secrets and build output out of the build context."
    rationale: Without it the whole working tree, including `.env` files and the git history, is sent to the builder and can end up in a layer.
    fix:
      human: "Add .dockerignore listing .git, .env*, build output and anything the image does not need."
      agent: "Add .dockerignore with .git, .env*, the stack's build output and dependency directories; check that the image still builds."
    refs: ["docs/baseline.md#robustness"]

  - id: containers/non-root-user
    title: Containers do not run as root
    kind: expr
    severity: warning
    scope: root
    when: tracked().exists(p, p.matches("(^|/)(Dockerfile|Containerfile)[^/]*$"))
    foreach: tracked().filter(p, p.matches("(^|/)(Dockerfile|Containerfile)[^/]*$") && !p.endsWith(".dockerignore"))
    expr: >
      lines(item).exists(l, l.matches("(?i)^\\s*USER\\s+\\S+") && !l.matches("(?i)^\\s*USER\\s+(root|0)(:\\S+)?\\s*$"))
      || lines(item).exists(l, l.matches("(?i)^\\s*FROM\\s+\\S*(:nonroot|-nonroot|cgr\\.dev/)"))
    message: "the image runs as root: no USER instruction selects another user"
    requirement: "Every Dockerfile sets a non-root `USER`, or builds on a base image that is non-root by default (`:nonroot` tags)."
    rationale: A process that is root in the container is one kernel or runtime bug away from root on the host, and can rewrite everything in its own image.
    fix:
      human: "Create a user in the final stage and add `USER <name>` before the entrypoint."
      agent: "In the final stage add a dedicated user and a USER instruction before ENTRYPOINT/CMD; make sure files the process writes are owned by that user."
    refs: ["docs/baseline.md#robustness"]

  - id: containers/base-image-pinned
    title: Base images are pinned by digest
    kind: expr
    severity: info
    scope: root
    tiers: [1]
    when: tracked().exists(p, p.matches("(^|/)(Dockerfile|Containerfile)[^/]*$"))
    foreach: tracked().filter(p, p.matches("(^|/)(Dockerfile|Containerfile)[^/]*$") && !p.endsWith(".dockerignore"))
    expr: >
      lines(item).filter(l, l.matches("(?i)^\\s*FROM\\s+")).all(l,
        l.contains("@sha256:")
        || l.matches("(?i)^\\s*FROM\\s+(--platform=\\S+\\s+)?(scratch|\\$\\S+)(\\s|$)")
        || lines(item).exists(s, s.matches("(?i)^\\s*FROM\\s+.+\\s+AS\\s+[\\w.-]+\\s*$")
             && l.matches("(?i)^\\s*FROM\\s+(--platform=\\S+\\s+)?" + s.trim().substring(s.trim().lastIndexOf(" ") + 1) + "(\\s|$)")))
    message: "a FROM line uses a tag without a digest"
    requirement: "Every `FROM` names its image with `@sha256:<digest>`; `scratch`, build arguments and earlier stages are exempt."
    rationale: A tag can be moved to a different image at any time; a digest cannot, and Renovate keeps it current.
    fix:
      human: "Append the digest to each base image (`image:tag@sha256:…`); Renovate updates both."
      agent: "Resolve each base image tag to its current digest and write it as image:tag@sha256:<digest>; do not change the tag."
    refs: ["docs/baseline.md#robustness"]

  - id: public/manifest-license
    title: Package manifest declares the license
    kind: expr
    severity: info
    tiers: [1]
    when: repo.public
    foreach: repo.stacks
    expr: >
      (item != "node" || scan("package.json", "\"license\"\\s*:").size() > 0)
      && (item != "python" || !file("pyproject.toml") || scan("pyproject.toml", "^\\s*license(-files)?\\s*=|License ::").size() > 0)
      && (item != "rust" || scan("Cargo.toml", "^\\s*license(-file)?(\\.workspace)?\\s*=").size() > 0)
    message: "the package manifest for this stack does not declare a license"
    requirement: "The package manifest names the license with an SPDX identifier: `license` in package.json, `project.license` in pyproject.toml, `package.license` in Cargo.toml. Stacks without such a field are not checked."
    rationale: Registries, SBOM tools and license checkers read the manifest, not the LICENSE file.
    fix:
      human: "Add the SPDX identifier of the LICENSE file to the manifest; `fleetlint fix --apply` does it for package.json and Cargo.toml when the LICENSE text is one recognised license. GNU licenses are left to you: write `-only` or `-or-later`, which the license text does not decide."
      agent: "Set the manifest's license field to the SPDX identifier matching the LICENSE file; ask if the LICENSE text is not a recognised license."
      actions:
        - set: {file: package.json, key: license, value: "{license}"}
        - set: {file: Cargo.toml, key: package.license, value: "{license}"}
    refs: ["docs/baseline.md#public-repositories"]

  - id: public/issue-templates
    title: Public repository has issue or pull-request templates
    kind: expr
    severity: info
    scope: root
    tiers: [1]
    when: repo.public
    expr: >
      exists(".github/ISSUE_TEMPLATE/*") || exists(".gitea/ISSUE_TEMPLATE/*") || exists(".gitea/issue_template/*")
      || exists(".github/ISSUE_TEMPLATE.md") || exists(".github/issue_template.md") || exists(".gitea/issue_template.md")
      || exists(".github/PULL_REQUEST_TEMPLATE*") || exists(".github/pull_request_template*")
      || exists(".gitea/PULL_REQUEST_TEMPLATE*") || exists(".gitea/pull_request_template*")
    message: "no issue or pull-request template"
    requirement: "An issue template or a pull-request template exists in `.github/` or `.gitea/`."
    rationale: A template asks for the version, the steps and the expected result once, instead of in the first three comments of every report.
    fix:
      human: "Add .github/ISSUE_TEMPLATE/bug.md asking for version, steps and expected result; add a pull-request template listing what `make check` must show."
      agent: "Add a bug-report issue template and a pull-request template under .github/ (Gitea reads them too); keep each under 20 lines."
    refs: ["docs/baseline.md#public-repositories"]

  - id: slop/focused-tests
    title: No focused tests are committed
    kind: expr
    severity: error
    scope: root
    foreach: >
      codegrep("code", r'\b(fdescribe|fit|describe\.only|it\.only|test\.only)\(|\bsolo:\s*true')
    expr: >
      false
    message: "a focused test is committed"
    requirement: "No test is marked to run alone (`fdescribe`, `fit`, `.only`, `solo: true`)."
    rationale: "A focused test silently disables every other test in the suite while CI stays green."
    fix:
      human: "Remove the focus marker."
      agent: "Remove the focus marker and run the whole suite."
    refs: ["docs/baseline.md#slop"]

  - id: slop/conflict-markers
    title: No merge conflict markers in source
    kind: expr
    severity: error
    scope: root
    foreach: >
      codegrep("code", r'^(<{7}|>{7}|={7})( |$)')
    expr: >
      false
    message: "a merge conflict marker is committed"
    requirement: "No source file contains conflict markers."
    rationale: "The file does not mean what either side intended and usually does not compile."
    fix:
      human: "Resolve the conflict and remove the markers."
      agent: "Resolve the conflict using both sides' intent; ask when they contradict."
    refs: ["docs/baseline.md#slop"]

  - id: slop/scratch-scripts
    title: No scratch scripts at the repository root
    kind: expr
    severity: warning
    scope: root
    foreach: >
      tracked().filter(p, p.matches(r'^(test|fix|debug|temp|tmp|scratch|try|quick)[_-][^/]*\.(py|js|ts|sh|go|dart|kt|rs)$'))
    expr: >
      false
    message: "scratch script at the repository root"
    requirement: "No one-off scripts such as `fix_imports.py`, `debug-auth.js` or `tmp_check.sh` are tracked at the root."
    rationale: "They were written to answer one question once; nobody knows later whether they are safe to run or to delete."
    fix:
      human: "Delete the script, or move it into a tools directory with a name that says what it does."
      agent: "Report the script; delete it only if nothing references it, otherwise move it under scripts/ with a descriptive name."
    refs: ["docs/baseline.md#slop"]

  - id: slop/report-documents
    title: No generated report documents are tracked
    kind: expr
    severity: warning
    scope: root
    foreach: >
      tracked().filter(p, p.matches(r'^(docs/)?[A-Z0-9_-]*(SUMMARY|REPORT|FIXES|IMPLEMENTATION|PROGRESS|ANALYSIS|REFACTOR(ING)?_PLAN|CHANGES_MADE|UPDATES|NEXT_STEPS)[A-Z0-9_-]*\.md$'))
    expr: >
      false
    message: "report document is tracked"
    requirement: "No status or summary documents such as `FIX_SUMMARY.md`, `IMPLEMENTATION_REPORT.md` or `NEXT_STEPS.md` are tracked."
    rationale: "They describe one working session, go stale with the next commit and bury the documentation that is maintained."
    fix:
      human: "Delete the file; move anything lasting into the README, an ADR or the changelog."
      agent: "Move lasting content into README, docs/adr or CHANGELOG and delete the file."
    refs: ["docs/baseline.md#slop"]

  - id: lint/python-rules-enabled
    title: ruff selects the baseline rule families
    kind: expr
    severity: warning
    stacks: [python]
    when: file("pyproject.toml") && has(toml("pyproject.toml").tool) && has(toml("pyproject.toml").tool.ruff)
    params:
      required: [E, F, I, B, UP, SIM, BLE, S, C90, T20]
    foreach: params.required
    expr: >
      (has(toml("pyproject.toml").tool.ruff.lint) && has(toml("pyproject.toml").tool.ruff.lint.select)
        && (item in toml("pyproject.toml").tool.ruff.lint.select || "ALL" in toml("pyproject.toml").tool.ruff.lint.select))
      || (has(toml("pyproject.toml").tool.ruff.select)
        && (item in toml("pyproject.toml").tool.ruff.select || "ALL" in toml("pyproject.toml").tool.ruff.select))
    message: "ruff rule family is not selected"
    requirement: "`[tool.ruff.lint] select` in pyproject.toml contains every family in `params.required` (pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, blind-except, bandit, complexity, print), or `ALL`."
    rationale: ruff's default selection is a small subset; blind excepts, security findings and leftover prints are only reported when their families are selected.
    fix:
      human: "Add the missing families to `select` under [tool.ruff.lint]."
      agent: "Add each reported family to [tool.ruff.lint] select; ratchet the violations that appear with `ruff check --add-noqa` instead of fixing them in the same change."
    refs: ["docs/stacks.md#python"]

  - id: lint/node-strict-flags
    title: tsconfig enables the strict compiler flags
    kind: expr
    severity: warning
    stacks: [node]
    when: file("tsconfig.json") && json("tsconfig.json") != null && !has(json("tsconfig.json").extends)
    params:
      required: [strict, noUncheckedIndexedAccess, exactOptionalPropertyTypes, noImplicitOverride, noFallthroughCasesInSwitch]
    foreach: params.required
    expr: >
      has(json("tsconfig.json").compilerOptions)
      && item in json("tsconfig.json").compilerOptions
      && json("tsconfig.json").compilerOptions[item] == true
    message: "strict compiler flag is not enabled"
    requirement: "tsconfig.json sets every flag in `params.required` to true. A tsconfig that `extends` another configuration is not checked, because the flags may come from there."
    rationale: "`strict` alone leaves indexed access, optional properties and switch fallthrough unchecked; these flags close the gaps that produce undefined at run time."
    fix:
      human: "Set the missing flags to true under compilerOptions."
      agent: "Set each reported flag to true in tsconfig.json compilerOptions, run tsc --noEmit and list the errors that appear instead of silencing them."
    refs: ["docs/stacks.md#nodejs--typescript"]

  - id: lint/rust-lints-denied
    title: clippy reports unwraps, panics and debug macros
    kind: expr
    severity: warning
    stacks: [rust]
    when: >
      (has(toml("Cargo.toml").lints) && has(toml("Cargo.toml").lints.clippy))
      || (has(toml("Cargo.toml").workspace) && has(toml("Cargo.toml").workspace.lints) && has(toml("Cargo.toml").workspace.lints.clippy))
    params:
      required: [unwrap_used, expect_used, panic, todo, dbg_macro]
    foreach: params.required
    expr: >
      (has(toml("Cargo.toml").lints) && has(toml("Cargo.toml").lints.clippy)
        && item in toml("Cargo.toml").lints.clippy && toml("Cargo.toml").lints.clippy[item] != "allow")
      || (has(toml("Cargo.toml").workspace) && has(toml("Cargo.toml").workspace.lints) && has(toml("Cargo.toml").workspace.lints.clippy)
        && item in toml("Cargo.toml").workspace.lints.clippy && toml("Cargo.toml").workspace.lints.clippy[item] != "allow")
    message: "clippy lint is not enabled"
    requirement: "The `[lints.clippy]` table (or `[workspace.lints.clippy]`) sets every lint in `params.required` to warn or deny."
    rationale: These lints are off by default, and they are the ones that find the crashes a Rust program can still have.
    fix:
      human: "Add the missing lints to [lints.clippy] with level deny."
      agent: "Add each reported lint to [lints.clippy] as \"deny\"; where an unwrap is a proven invariant, replace it with expect and an INVARIANT comment instead of allowing the lint."
    refs: ["docs/stacks.md#rust"]

  - id: lint/flutter-strict-modes
    title: The Dart analyzer runs in all three strict modes
    kind: expr
    severity: warning
    stacks: [flutter]
    when: file("analysis_options.yaml") && yaml("analysis_options.yaml") != null
    params:
      required: [strict-casts, strict-inference, strict-raw-types]
    foreach: params.required
    expr: >
      has(yaml("analysis_options.yaml").analyzer) && has(yaml("analysis_options.yaml").analyzer.language)
      && item in yaml("analysis_options.yaml").analyzer.language
      && yaml("analysis_options.yaml").analyzer.language[item] == true
    message: "analyzer strict mode is not enabled"
    requirement: "`analyzer.language` in analysis_options.yaml sets every mode in `params.required` to true."
    rationale: Each mode closes a different hole through which `dynamic` enters the program unnoticed.
    fix:
      human: "Set the missing modes to true under analyzer.language."
      agent: "Set each reported mode to true under analyzer.language and list the analyzer errors that appear instead of adding ignores."
    refs: ["docs/stacks.md#flutter--dart"]

  - id: quality/policy-enforced
    title: fleetlint runs automatically
    kind: expr
    severity: warning
    scope: root
    tiers: [1, 2]
    expr: >
      text(".pre-commit-config.yaml").contains("fleetlint")
      || text("lefthook.yml").contains("fleetlint")
      || ["Makefile", "package.json", "build.gradle", "build.gradle.kts", "justfile", "Taskfile.yml"].exists(f, text(f).contains("fleetlint"))
      || workflows().exists(w, text(w).contains("fleetlint"))
    message: "nothing runs fleetlint: not a hook, not the task runner, not a workflow"
    requirement: "`fleetlint check` runs without anyone remembering to: as a git hook, in the task runner's `check` target, or in a CI workflow."
    rationale: A policy that is only checked by hand drifts with the first busy week; the report is then a description of last month.
    fix:
      human: "Add `fleetlint check --fail-on error` to the `check` target, and the fleetlint hook to .pre-commit-config.yaml (see docs/integrations.md)."
      agent: "Add `fleetlint check --fail-on error` as the last step of the task runner's check target and a local fleetlint hook to .pre-commit-config.yaml; make sure CI installs fleetlint before it runs the check."
    refs: ["docs/integrations.md"]

  - id: repo/dev-environment
    title: The development tools are reproducible
    kind: outcome
    severity: warning
    scope: root
    tiers: [1, 2]
    satisfiers:
      - name: devcontainer
        expr: file(".devcontainer/devcontainer.json") || file(".devcontainer.json") || exists(".devcontainer/*/devcontainer.json")
      # With the dev container flag set (`repo.devcontainer`), only the container counts.
      - name: nix
        when: "!repo.devcontainer"
        expr: file("flake.nix") || file("shell.nix") || file("devenv.nix") || file("devenv.yaml")
      - name: version-manager
        when: "!repo.devcontainer"
        expr: file("mise.toml") || file(".mise.toml") || file(".tool-versions")
      - name: tools-target
        when: "!repo.devcontainer && file(\"Makefile\")"
        expr: >
          "tools" in makefile("Makefile").recipes
          && makefile("Makefile").recipes["tools"].exists(l, l.matches("(@v?[0-9]|==[0-9])"))
          && !makefile("Makefile").recipes["tools"].exists(l, l.contains("@latest"))
    partials:
      - name: tools-unpinned
        severity: info
        expr: >
          file("Makefile") && "tools" in makefile("Makefile").recipes
          && makefile("Makefile").recipes["tools"].exists(l, l.contains("@latest"))
        message: "the tools target installs @latest: two machines get different tools"
    message: "nothing in the repository says which tools to install, or how"
    requirement: >
      Someone with a fresh machine gets the same toolchain and tools as everyone else from what is in the
      repository: a dev container (`.devcontainer/devcontainer.json`), a Nix flake or devenv, a version
      manager file (`mise.toml`, `.tool-versions`), or a `tools` target that installs pinned versions.
      Any one of them is enough; the task runner stays the interface that hooks and CI use.
      When the dev container flag is set (a devcontainer.json exists, or `facts.devcontainer: true`), the
      dev container is the mechanism and has to be there.
    rationale: Lint and test results that depend on which linter version a contributor happens to have are not results; a second contributor's first hour should not go into guessing tools.
    fix:
      human: "Choose. For a dev container set `facts.devcontainer: true` and run `fleetlint fix --apply`: it writes the container for the repository's stacks, and the Makefile and check workflow it writes run inside it. To stay on the machine, give the `tools` target pinned versions or add a version-manager file."
      agent: "Ask which mechanism the user wants. Dev container: set facts.devcontainer true in .fleetlint.yaml and run `fleetlint fix --apply`. Machine: add a `tools` target to the task runner that installs every tool at a fixed version. Do not add more than one mechanism."
      actions:
        - template: "{stack}/devcontainer.json"
          to: .devcontainer/devcontainer.json
    refs: ["docs/baseline.md#task-runner-contract"]

  - id: taskrunner/devcontainer
    title: The task runner uses the dev container
    kind: expr
    severity: warning
    scope: root
    tiers: [1, 2]
    when: repo.devcontainer && taskrunner.kind == "make"
    expr: text("Makefile").matches("devcontainer (exec|up)")
    message: "the repository has a dev container but `make` runs on the machine"
    requirement: >
      When the dev container flag is set (a devcontainer.json exists, or `facts.devcontainer: true`), `make <target>`
      called outside the container runs the target inside it, so results do not depend on what is installed on
      the machine. A switch (`DEVCONTAINER=0`) keeps running on the machine possible. Repositories that do not
      use a dev container run on the machine and are not checked; `facts.devcontainer: false` says so explicitly.
    rationale: A dev container that the gates do not use is a second environment next to the real one, and the two drift apart.
    fix:
      human: "Forward the targets into the container when make runs outside it (`fleetlint explain taskrunner/devcontainer` shows the switch), or set `facts.devcontainer: false`."
      agent: "At the top of the Makefile add `DEVCONTAINER ?= 1` and, when `$(DEVCONTAINER)$(IN_DEVCONTAINER)` equals 1, define every target as `devcontainer up --workspace-folder . && devcontainer exec --workspace-folder . make $@ DEVCONTAINER=0`; keep the existing recipes in the else branch. Set containerEnv IN_DEVCONTAINER=1 in devcontainer.json."
      actions:
        - template: Makefile
    refs: ["docs/baseline.md#task-runner-contract"]
