apiVersion: fleetlint.org/v1
kind: Catalog
metadata:
  name: fleetlint-minimal
  version: 0.1.0
  description: >
    The floor for any repository, including experiments: nothing secret or
    accidental is tracked, hooks exist, and public repos carry no agent files.

rules:
  - id: repo/no-tracked-junk
    title: No editor, OS or backup files are tracked
    kind: go
    severity: error
    requirement: >
      Files such as .DS_Store, Thumbs.db, *.bak, *.orig, *.swp, *.log and
      nohup.out are never committed.
    rationale: They are noise at best and leak local paths or data at worst.
    fix:
      human: "git rm --cached the listed files and add their patterns to .gitignore."
      agent: "Untrack the listed junk files with git rm --cached, add matching patterns to .gitignore, commit as chore."
      actions:
        - untrack: "*"
          gitignore: [".DS_Store", "Thumbs.db", "*.bak", "*.orig", "*.swp", "*~", "*.log", "nohup.out", "__pycache__/"]
    refs: ["docs/baseline.md#hygiene"]

  - id: repo/no-tracked-env
    title: No .env files are tracked
    kind: expr
    severity: error
    expr: >
      !tracked().exists(f, f.matches('(^|/)\\.env(\\.[^/]*)?$')
                        && !f.matches('\\.(example|sample|template|dist)$'))
    message: "a .env file is tracked; only .env.example-style templates belong in git"
    requirement: Environment files that may hold credentials are never committed; templates with placeholder values are fine.
    rationale: A tracked .env is the most common way credentials leak into history.
    fix:
      human: "git rm --cached the .env file, add .env* to .gitignore, rotate any secret it contained."
      agent: "Untrack the .env file, add `.env` and `.env.*` (but not `.env.example`) to .gitignore, and tell the user which secrets must be rotated."
    refs: ["docs/baseline.md#security"]

  - id: repo/gitignore-present
    title: A .gitignore exists
    kind: expr
    severity: warning
    scope: root
    expr: file(".gitignore")
    message: ".gitignore is missing"
    requirement: The repository root has a .gitignore.
    rationale: Without one, build output and local files end up tracked.
    fix:
      human: "Add a .gitignore for the stack (gitignore.io or the stack template)."
      agent: "Create .gitignore with the standard patterns for the detected stacks and OS/editor files."
      actions:
        - gitignore: [".DS_Store", "*.log", ".env", ".env.*", "!.env.example"]

  - id: hooks/config-present
    title: Git hooks are configured
    kind: expr
    severity: error
    scope: root
    tiers: [1, 2]
    expr: file(".pre-commit-config.yaml") || file("lefthook.yml") || file(".lefthook.yml")
    message: "no hook configuration found (.pre-commit-config.yaml or lefthook.yml)"
    requirement: The repository declares pre-commit hooks that run on every commit.
    rationale: Hooks are the only gate that runs before code reaches the remote; everything else is after the fact.
    fix:
      human: "Run `fleetlint fix --apply` to add .pre-commit-config.yaml for the stack, then `prek install`."
      agent: "Create .pre-commit-config.yaml from the shared template plus the stack block, run `prek update` and `prek install`."
      actions:
        - template: "{stack}/pre-commit-config.yaml"
          to: .pre-commit-config.yaml
    refs: ["docs/baseline.md#git-hooks"]

  - id: hooks/secret-scan
    title: Hooks scan for secrets
    kind: expr
    severity: error
    scope: root
    tiers: [1, 2]
    when: file(".pre-commit-config.yaml")
    expr: >
      yaml(".pre-commit-config.yaml").repos.exists(r,
        r.repo.contains("gitleaks") ||
        (has(r.hooks) && r.hooks.exists(h, h.id in ["gitleaks", "detect-private-key", "detect-secrets"])))
    message: "no secret-scanning hook (gitleaks or detect-private-key) in .pre-commit-config.yaml"
    requirement: A pre-commit hook blocks commits containing secrets.
    rationale: Secrets must be stopped before they enter history; removing them afterwards means rotation and rewrites.
    fix:
      human: "Add the gitleaks hook (repo: https://github.com/gitleaks/gitleaks) to .pre-commit-config.yaml."
      agent: "Add the gitleaks pre-commit hook to .pre-commit-config.yaml and run `prek update`."

  - id: public/no-agent-files
    title: Public repositories track no agent instruction files
    kind: expr
    severity: error
    scope: root
    when: repo.public
    expr: >
      !tracked().exists(f, f.matches('(^|/)(CLAUDE|CLAUDE\\.local|AGENTS)\\.md$')
                        || f.startsWith('.claude/') || f.startsWith('.agent/'))
    message: "an agent instruction file is tracked in a public repository"
    requirement: CLAUDE.md, AGENTS.md, .claude/ and .agent/ stay untracked in public repositories (listed in .git/info/exclude).
    rationale: The owner's policy is that public repositories carry no AI tooling artefacts.
    fix:
      human: "git rm --cached the files and list them in .git/info/exclude so they stay local."
      agent: "Untrack the listed files with git rm --cached, add them to .git/info/exclude (not .gitignore), and commit."
    refs: ["docs/baseline.md#public-repositories"]

  - id: public/no-ai-attribution
    title: Public history carries no AI attribution
    kind: expr
    severity: error
    scope: root
    when: repo.public && repo.has_git
    params:
      commits: 200
    foreach: commits(params.commits)
    expr: >
      !(item.email.endsWith("@anthropic.com")
        || item.author.matches("(?i)\\b(claude|copilot|chatgpt|openai|gemini|cursor|codex|devin|aider)\\b")
        || item.trailers.matches("(?i)co-authored-by:.*(claude|copilot|chatgpt|openai|gemini|cursor|codex|devin|aider|noreply@anthropic|noreply@github\\.com>\\s*$)")
        || item.body.matches("(?i)(generated|written) (with|by) \\[?(claude|copilot|chatgpt|cursor|codex|aider)"))
    message: "commit carries AI attribution"
    requirement: >
      No commit in the recent history (`params.commits`, default 200) names an AI tool as author or co-author
      or carries a "generated with" footer. The owner's policy is that public repositories show human authorship only.
    rationale: Attribution trailers are added by default by agent tooling; preventing them is a settings matter, removing them is a history rewrite.
    fix:
      human: "Turn off commit attribution in the agent's settings; rewrite only unpushed history."
      agent: "Stop adding Co-Authored-By trailers. Report the offending commits; rewriting pushed history needs the user's explicit decision."
    refs: ["docs/baseline.md#public-repositories"]
