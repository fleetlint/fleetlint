  - repo: local
    hooks:
      - id: spotless
        name: spotless (ktlint/ktfmt)
        entry: ./gradlew spotlessApply --quiet
        language: system
        types: [kotlin]
        pass_filenames: false
      - id: detekt
        name: detekt
        entry: ./gradlew detekt --quiet
        language: system
        types: [kotlin]
        pass_filenames: false
