  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx --no-install prettier --write --ignore-unknown
        language: system
        types_or: [javascript, jsx, ts, tsx, json, css, scss, markdown, yaml]
      - id: eslint
        name: eslint
        entry: npx --no-install eslint --fix --max-warnings=0
        language: system
        types_or: [javascript, jsx, ts, tsx]
      - id: tsc
        name: tsc --noEmit
        entry: npx --no-install tsc --noEmit -p .
        language: system
        types_or: [ts, tsx]
        pass_filenames: false
