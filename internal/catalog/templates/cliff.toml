# git-cliff configuration: changelog from conventional commits (Keep a Changelog layout)
[changelog]
header = "# Changelog\n\nAll notable changes to this project are documented here.\nFormat: Keep a Changelog. Versioning: Semantic Versioning.\n"
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## [Unreleased]{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}- {% if commit.breaking %}**BREAKING** {% endif %}{{ commit.message | upper_first }}{% if commit.scope %} ({{ commit.scope }}){% endif %}
{% endfor %}{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^(chore\\(release\\)|chore\\(deps\\)|build\\(deps\\))", skip = true },
  { message = "^(test|chore|build|ci|style|revert)", skip = true },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
