# One file for GitHub and Gitea:
# Gitea Actions reads .github/workflows/ too, and both forges set github.server_url.
# Actions are pinned to commit SHAs; `pinact run -u` updates them
# (Renovate keeps the pins current via renovate.json).
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release            # GitHub: protect with required reviewers / tag rules; ignored on Gitea
    permissions:
      contents: write               # create the release and upload assets
      id-token: write               # GitHub only: keyless cosign + attestations (ignored on Gitea)
      attestations: write           # GitHub only
      packages: write               # container images / packages, if used
    env:
      IS_GITHUB: ${{ github.server_url == 'https://github.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml   # needs environment.flutter in pubspec
          cache: true
      - name: Verify tag is on main and check passes
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag not on main"; exit 1; }
          make check

      - name: Build release artifacts into dist/
        run: make dist VERSION="${GITHUB_REF_NAME#v}"

      - name: SBOMs (SPDX JSON, one for the source tree and one per artifact)
        run: |
          set -euo pipefail
          syft scan dir:. -o spdx-json="dist/${GITHUB_REPOSITORY##*/}-${GITHUB_REF_NAME}.source.spdx.json"
          for f in dist/*; do
            case "$f" in *.spdx.json|*.sigstore.json|*.sha256) continue;; esac
            syft scan "file:$f" -o spdx-json="$f.spdx.json"
          done

      - name: Checksums
        run: cd dist && sha256sum -- $(ls | grep -v -e '\.sigstore\.json$' -e '^checksums\.sha256$') > checksums.sha256

      - name: Sign (keyless via OIDC on GitHub)
        if: env.IS_GITHUB == 'true'
        run: |
          set -euo pipefail
          for f in dist/*; do
            case "$f" in *.sigstore.json) continue;; esac
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Sign (key from secrets on Gitea)
        if: env.IS_GITHUB != 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          for f in dist/*; do
            case "$f" in *.sigstore.json) continue;; esac
            cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --bundle "$f.sigstore.json" "$f"
          done

      - name: Verify what we just signed
        run: |
          set -euo pipefail
          if [ "$IS_GITHUB" = "true" ]; then
            cosign verify-blob --bundle dist/checksums.sha256.sigstore.json \
              --certificate-identity-regexp "^${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com dist/checksums.sha256
          else
            echo "$COSIGN_PUBLIC_KEY" > cosign.pub
            cosign verify-blob --bundle dist/checksums.sha256.sigstore.json --key cosign.pub dist/checksums.sha256
          fi
        env:
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}

      - name: Build provenance attestation (SLSA, GitHub only)
        if: env.IS_GITHUB == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: SBOM attestation (GitHub only)
        if: env.IS_GITHUB == 'true'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/checksums.sha256
          sbom-path: dist/${{ github.event.repository.name }}-${{ github.ref_name }}.source.spdx.json

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/{p = index($0, "[" v "]")} p' CHANGELOG.md > dist/.notes.md
          [ -s dist/.notes.md ] || echo "Release ${GITHUB_REF_NAME}" > dist/.notes.md
          cat >> dist/.notes.md <<'EOF'

          ### Verify
          Every asset has a `.sigstore.json` bundle and a `.spdx.json` SBOM.
          `cosign verify-blob --bundle <asset>.sigstore.json <asset>` (keyless) or `--key cosign.pub` (key-based).
          EOF

      - name: Publish release (GitHub)
        if: env.IS_GITHUB == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: dist/.notes.md
          files: dist/*
          fail_on_unmatched_files: true

      - name: Publish release (Gitea)
        if: env.IS_GITHUB != 'true'
        uses: akkuman/gitea-release-action@5a83c90484ef4355121df5eb60558c8ce66e81ac # v1
        with:
          body_path: dist/.notes.md
          files: dist/*
