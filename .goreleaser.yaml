# GoReleaser v2. Builds, checksums, SBOMs (syft) and signs (cosign) the release
# on whichever forge runs release.yml. Signing: keyless via OIDC on GitHub,
# key-based (COSIGN_PRIVATE_KEY) on Gitea; the workflow sets the env.
version: 2
project_name: fleetlint

before:
  hooks:
    - go mod verify

builds:
  - main: ./cmd/fleetlint
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/fleetlint/fleetlint/internal/cli.Version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, CHANGELOG.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256

nfpms:
  - package_name: fleetlint
    vendor: fleetlint
    homepage: https://fleetlint.org
    maintainer: The fleetlint authors <https://github.com/fleetlint/fleetlint>
    description: Checks how repositories are set up against a catalog of rules and tells you how to close each gap.
    license: MIT
    formats: [deb, rpm, apk, archlinux]
    dependencies: [git]
    file_name_template: "{{ .ConventionalFileName }}"
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/fleetlint/LICENSE

sboms:
  - id: archives
    artifacts: archive
    documents: ["{{ .ArtifactName }}.spdx.json"]
    cmd: syft
    args: ["$artifact", "--output", "spdx-json=$document"]
  - id: packages
    artifacts: package
    documents: ["{{ .ArtifactName }}.spdx.json"]
    cmd: syft
    args: ["$artifact", "--output", "spdx-json=$document"]

# The container, the cask, the Scoop manifest and the Nix package are
# published from GitHub only: the deploy keys live in the release
# environment there, and the image goes to ghcr.io.
dockers_v2:
  - images: [ghcr.io/fleetlint/fleetlint]
    tags: ["{{ .Version }}", "{{ if not .Prerelease }}latest{{ end }}"]
    platforms: [linux/amd64, linux/arm64]
    sbom: true
    disable: '{{ ne (envOrDefault "IS_GITHUB" "") "true" }}'
    labels:
      org.opencontainers.image.title: fleetlint
      org.opencontainers.image.source: https://github.com/fleetlint/fleetlint
      org.opencontainers.image.url: https://fleetlint.org
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT

docker_signs:
  - cmd: cosign
    artifacts: manifests
    args: ["sign", "--yes", "${artifact}@${digest}"]

homebrew_casks:
  - name: fleetlint
    directory: Casks
    homepage: https://fleetlint.org
    description: Checks how repositories are set up against a catalog of rules
    license: MIT
    skip_upload: '{{ if envOrDefault "TAP_DEPLOY_KEY" "" }}auto{{ else }}true{{ end }}'
    commit_author:
      name: fleetlint release
      email: fleetlint-release@users.noreply.github.com
    commit_msg_template: "chore: fleetlint {{ .Tag }}"
    repository:
      owner: fleetlint
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:fleetlint/homebrew-tap.git
        private_key: '{{ envOrDefault "TAP_DEPLOY_KEY" "" }}'
    hooks:
      post:
        # The binary is signed with cosign, not by Apple; without this macOS refuses to start it.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/fleetlint"]
          end

scoops:
  - name: fleetlint
    homepage: https://fleetlint.org
    description: Checks how repositories are set up against a catalog of rules and tells you how to close each gap.
    license: MIT
    depends: [git]
    skip_upload: '{{ if envOrDefault "SCOOP_DEPLOY_KEY" "" }}auto{{ else }}true{{ end }}'
    commit_author:
      name: fleetlint release
      email: fleetlint-release@users.noreply.github.com
    commit_msg_template: "chore: fleetlint {{ .Tag }}"
    repository:
      owner: fleetlint
      name: scoop-bucket
      branch: main
      git:
        url: git@github.com:fleetlint/scoop-bucket.git
        private_key: '{{ envOrDefault "SCOOP_DEPLOY_KEY" "" }}'

nix:
  - name: fleetlint
    path: pkgs/fleetlint/default.nix
    homepage: https://fleetlint.org
    description: Checks how repositories are set up against a catalog of rules
    license: mit
    dependencies: [git]
    skip_upload: '{{ if envOrDefault "NUR_DEPLOY_KEY" "" }}auto{{ else }}true{{ end }}'
    commit_author:
      name: fleetlint release
      email: fleetlint-release@users.noreply.github.com
    commit_msg_template: "chore: fleetlint {{ .Tag }}"
    repository:
      owner: fleetlint
      name: nur
      branch: main
      git:
        url: git@github.com:fleetlint/nur.git
        private_key: '{{ envOrDefault "NUR_DEPLOY_KEY" "" }}'

signs:
  - cmd: ./scripts/sign.sh   # keyless on GitHub, --key when COSIGN_PRIVATE_KEY is set (Gitea)
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["${artifact}"]

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.*\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.*\))?!?:'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude: ['^chore', '^docs', '^test', '^ci', '^style', '^refactor']

release:
  draft: false
  prerelease: auto
  footer: |
    Verify the checksums signature (keyless, GitHub-built releases):

        cosign verify-blob --bundle checksums.txt.sigstore.json \
          --certificate-identity 'https://github.com/fleetlint/fleetlint/.github/workflows/release.yml@refs/tags/{{ .Tag }}' \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          checksums.txt

gitea_urls:
  # release.yml exports these on Gitea; on GitHub they are empty and unused.
  api: '{{ envOrDefault "GITEA_API_URL" "" }}'
  download: '{{ envOrDefault "GITEA_DOWNLOAD_URL" "" }}'
  skip_tls_verify: false
